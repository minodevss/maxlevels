name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            build/libs/*.jar
            build/distributions/*.zip

  boot:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.21', java: 21 }
          - { minecraft: '1.21.4', java: 21 }
          - { minecraft: '1.21.11', java: 21 }
          - { minecraft: '26.1.2', java: 25 }
          - { minecraft: '26.3', java: 25 }
    name: boot ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: scripts/boot-test.sh ${{ matrix.minecraft }} dist/libs/EnchantCap-*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: boot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/libs/*.jar dist/distributions/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
